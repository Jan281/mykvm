org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
# The Rust core is built for arm64 only; every device this targets is arm64.
android.defaultConfig.ndk.abiFilters=arm64-v8a

# The system default is a JRE (no javac) and the only JDK is 26, which Gradle
# 8.14 does not support. This one is user-local, installed alongside.
org.gradle.java.home=/home/jan/.local/opt/jdk-21.0.12+8
